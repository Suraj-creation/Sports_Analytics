[project]
name = "bai-agents"
version = "0.1.0"
description = "Grounded LLM agents over the canonical event store (API and local LLMs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bai-engine",
    "bai-badminton",
    "httpx>=0.28",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# closed models via direct API calls
anthropic = ["anthropic>=0.60"]
openai = ["openai>=1.60"]  # OpenAI, Azure OpenAI and local OpenAI-compatible servers (LM Studio / Ollama / vLLM)
all = ["anthropic>=0.60", "openai>=1.60"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bai_agents"]

[tool.hatch.build.targets.wheel.force-include]
"src/bai_agents/knowledge" = "bai_agents/knowledge"
