[project]
name = "bai-engine"
version = "0.1.0"
description = "Sport-agnostic real-time video analytics platform: timeline, schema, store, bus, media, runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "msgpack>=1.1",
    "python-ulid>=3.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "redis>=5.2",
    "opencv-python-headless>=4.10",
    "av>=13.0",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20", "torch>=2.5", "supervision>=0.25"]
gpu = ["onnxruntime-gpu>=1.20", "torch>=2.5", "torchcodec>=0.2", "nvidia-ml-py>=12.560"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bai_engine"]
