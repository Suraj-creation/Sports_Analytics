[project]
name = "bai-badminton"
version = "0.1.0"
description = "Badminton specialisation: perception adapters, events, BWF rules, analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bai-engine",
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.0",
]

[project.optional-dependencies]
perception = [
    "rtmlib>=0.0.15",
    "trackers>=2.0",
    "rapidocr>=3.0",
]

[project.entry-points."bai.sports"]
badminton = "bai_badminton.plugin:BadmintonPlugin"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bai_badminton"]

[tool.hatch.build.targets.wheel.force-include]
"src/bai_badminton/ontology.yaml" = "bai_badminton/ontology.yaml"
