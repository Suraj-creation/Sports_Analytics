# Opt-in experiment: sampled AI-draft identity agreement regressed; GPU defaults remain unchanged.
description: Doubles identity experiment — existing detector/pose and pinned OSNet FP32
device: cuda
analysis_height: 720
chunk_frames: 64
lead_buffer_s: 5.0

shuttle:
  model: tracknetv3
  backend: torch-cuda
  precision: fp16
  batch: 4
  input_size: [512, 288]
  params: {seq_len: 8, bg_mode: concat, threshold: 0.5, step: 8}
shuttle_live:
  model: racketvision_balltrack
  backend: torch-cuda
  precision: fp16
shuttle_second_opinion:
  model: wasb_badminton
  backend: torch-cuda
  precision: fp16
player_detector:
  model: rfdetr_small
  backend: onnx-cuda
  precision: fp16
  input_size: [512, 512]
  params: {score_threshold: 0.35, court_roi: true}
player_reid:
  model: osnet_ain_x0_25
  backend: torch-cuda
  precision: fp32
pose:
  model: rtmpose_m_body7
  backend: onnx-cuda
  precision: fp16
  batch: 2
  input_size: [192, 256]
racket:
  model: racketvision_racketpose
  backend: torch-cuda
  precision: fp16
stroke:
  model: bst_cg_ap_shuttleset
  backend: torch-cuda
  precision: fp32
  params: {window: fixed}
contact:
  model: contact_fusion_v0
  backend: none
ocr:
  model: rapidocr_v4
  backend: onnx-cuda

detector_rates: {in_play: 2, idle: 6, replay: 0}
pose_rates: {in_play: 1, idle: 6, replay: 0}
shuttle_rates: {in_play: 1, idle: 1, replay: 0}
ocr_every_s: 1.0
court_verify_every_s: 2.0
escalation_budget: 0.15
racket_window: 6
