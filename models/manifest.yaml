# Model registry — the runtime loads ONLY artifacts listed here.
#
# sha256: pinned digest of the downloaded file. "pin-on-first-fetch" means the digest is recorded
# in models/cache/lock.json the first time the file is fetched; every later load verifies it.
# Before a production deployment, run `bai models lock` and copy the digests here.
#
# license: of the weights/code as published. Mirror provenance is noted where the file is not
# hosted by the original authors. See research report §17 (licensing) before commercial use.
version: 1

models:
  tracknetv3:
    task: shuttle
    version: "3.0"
    format: torch
    source: {hf: "TanmaySarda/tracknetv3-weights", file: "TrackNet_best.pt"}
    size: 136190877
    sha256: pin-on-first-fetch
    license: MIT (qaz812345/TrackNetV3 code + checkpoints); HF mirror of the official Google Drive release
    input: {width: 512, height: 288, seq_len: 8, bg_mode: concat}

  inpaintnet:
    task: shuttle_refine
    version: "3.0"
    format: torch
    source: {hf: "TanmaySarda/tracknetv3-weights", file: "InpaintNet_best.pt"}
